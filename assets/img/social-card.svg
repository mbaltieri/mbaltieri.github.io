<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Manuel Baltieri</title>
  <desc id="description">Research in agent foundations, AI safety, artificial life, and cognition.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2230"/>
      <stop offset="0.58" stop-color="#12384a"/>
      <stop offset="1" stop-color="#081b27"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="48%" r="52%">
      <stop offset="0" stop-color="#4fb1ba" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4fb1ba" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#a8d9dd" fill-opacity="0.13"/>
    </pattern>
    <clipPath id="portraitClip">
      <circle cx="945" cy="310" r="210"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="650" width="550" height="630" fill="url(#dots)"/>

  <g fill="none" stroke="#4fb1ba" stroke-opacity="0.22" stroke-width="2">
    <path d="M640 82h190l52 52h224"/>
    <path d="M676 548h164l48-48h248"/>
    <path d="M708 138h88l34 34"/>
    <circle cx="640" cy="82" r="5" fill="#4fb1ba"/>
    <circle cx="676" cy="548" r="5" fill="#4fb1ba"/>
    <circle cx="1136" cy="500" r="5" fill="#4fb1ba"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="92" fill="#79c7ce" font-size="20" font-weight="700" letter-spacing="4">RESEARCHER · MATHEMATICAL MODELLER</text>

    <text x="78" y="204" fill="#ffffff" font-size="72" font-weight="700" letter-spacing="-1">MANUEL</text>
    <text x="78" y="282" fill="#ffffff" font-size="72" font-weight="700" letter-spacing="-1">BALTIERI</text>

    <rect x="82" y="325" width="72" height="5" rx="2.5" fill="#4fb1ba"/>
    <text x="82" y="374" fill="#d9e9ec" font-size="27" font-weight="400">Agent foundations · AI safety</text>
    <text x="82" y="413" fill="#d9e9ec" font-size="27" font-weight="400">Artificial life · Cognition</text>

    <g font-size="15" font-weight="700" letter-spacing="1.5">
      <rect x="82" y="460" width="116" height="42" rx="21" fill="#4fb1ba" fill-opacity="0.16" stroke="#70c2ca" stroke-opacity="0.65"/>
      <text x="140" y="487" fill="#a9dce0" text-anchor="middle">AGENCY</text>
      <rect x="214" y="460" width="150" height="42" rx="21" fill="#4fb1ba" fill-opacity="0.16" stroke="#70c2ca" stroke-opacity="0.65"/>
      <text x="289" y="487" fill="#a9dce0" text-anchor="middle">CYBERNETICS</text>
      <rect x="380" y="460" width="168" height="42" rx="21" fill="#4fb1ba" fill-opacity="0.16" stroke="#70c2ca" stroke-opacity="0.65"/>
      <text x="464" y="487" fill="#a9dce0" text-anchor="middle">AI &amp; ALIFE</text>
    </g>

    <text x="82" y="574" fill="#b6cbd0" font-size="21" letter-spacing="1">manuelbaltieri.com</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="945" cy="310" r="220" fill="#081923" stroke="#4fb1ba" stroke-width="2" stroke-opacity="0.7"/>
    <image x="665" y="100" width="560" height="420" xlink:href="blog/futurame.jpeg" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)"/>
    <circle cx="945" cy="310" r="210" fill="none" stroke="#c8edf0" stroke-width="7"/>
    <circle cx="945" cy="310" r="218" fill="none" stroke="#4fb1ba" stroke-width="2" stroke-opacity="0.85"/>
  </g>
</svg>
