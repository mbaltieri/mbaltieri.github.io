# Talks and podcasts, shown on /research/talks/ and, newest first, on the Research page.
#
# The page groups the entries by year, newest first, in the order they are listed here within a
# year.
#
#   title      as it should be printed (an entry without one prints its event as its title)
#   event      where it was given: the event, and the institution if there is one
#   place      optional, the city and the country
#   date       the year and the month, as "2026-02"
#   kind       invited | contributed | podcast (the filter buttons on the page use it)
#   note       optional, printed after the title, e.g. "panel discussion"
#   parts      optional, the parts of a series (lectures), each with a title and its own links
#   occasions  optional, other times the same talk was given, each with an event, a place and a date
#
# An entry has up to three links, and no others:
#
#   slides     a PDF of the slides
#   recording  a recording of the talk
#   link       the page of the event (for a podcast, its page)

