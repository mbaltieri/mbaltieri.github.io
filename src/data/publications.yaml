# Publications, shown on /research/publications/ (src/pages/research/publications.astro) and,
# picked by title, under the questions of the Research programme page
# (src/pages/research/index.astro).
#
# The page groups the entries by year in the order they are listed here: newest year first,
# and within a year the selected papers first.
#
#   title, authors, year   as they should be printed
#   venue                  optional, printed in italics
#   kind                   journal | conference | preprint | commentary | editing | other
#                          (its usual name, as "Journal article", is printed after the venue)
#   type                   optional, printed instead of the kind's usual name
#   note                   optional, printed after the type, e.g. "to appear"
#   selected               optional, true for the papers under "Selected publications" on the
#                          resume
#
# An entry has up to three links, and no others:
#
#   publisher              its page at the journal, the proceedings or the publisher
#   pdf                    a PDF of the published paper
#   preprint               the preprint, wherever it is kept (arXiv, OSF, a PDF, ...)

