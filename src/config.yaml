site:
  name: Manuel Baltieri
  site: 'https://manuelbaltieri.com'
  base: '/'
  # The addresses of the Jekyll site ended in a slash (/research/, /news/...), so these do too.
  trailingSlash: true

# Default SEO metadata
metadata:
  title:
    default: Manuel Baltieri
    template: '%s | Manuel Baltieri'
  description: 'Studying how agents can be identified, modelled, and composed, and what those formal choices imply for cognition, living systems, and AI safety.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Manuel Baltieri
    images:
      - url: '/assets/img/social-card.jpg'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: '@manuelbaltieri'
    site: '@manuelbaltieri'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

# The "blog" of the template was the News section of this site. News is retired: its posts were
# about papers and talks, which the Research, Publications and Talks pages now keep up to date, and
# the old addresses redirect (astro.config.ts). Set this to true to bring a blog back.
apps:
  blog:
    isEnabled: false
    postsPerPage: 10

    post:
      isEnabled: true
      # %id% is the file name in src/data/post/ without the extension, as in /news/2026-08-30-mathematical-agents/.
      permalink: '/news/%id%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true

    # The category of a post is its kind: Paper, Talk, Organising, ...
    category:
      isEnabled: true
      pathname: 'news/category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'news/tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"
    # GoatCounter (https://www.goatcounter.com) counts visits without cookies or personal data,
    # free for a personal site. Make an account, then put its code here: "manuelbaltieri" for
    # https://manuelbaltieri.goatcounter.com. Left empty, nothing is loaded.
    goatcounter:
      code: 'manuelbaltieri'

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
